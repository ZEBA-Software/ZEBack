[package]
name = "zeback"
version = "0.19.0"
edition = "2024"
authors = ["ZEBA Software UG"]
homepage = "https://zeba-software.de"
license = "Apache-2.0"
repository = "https://github.com/ZEBA-Software/ZEBack"
description = "Backup and restore tool for Windows: user profiles, drives and system images"

[[bin]]
name = "ZEBack"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
hmac = "0.13.0"
sha2 = "0.11.1"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu"] }
keyring = "4.2.0"
native-tls = "0.2.18"
percent-encoding = "2.3.2"
rfd = "0.18.0"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", default-features = false, features = ["native-tls"] }
walkdir = "2.5.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs", "chrono", "aes-crypto"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
